name: CI

on:
  push:
    branches: [ "acceptable" ]
  pull_request:
    branches: [ "acceptable" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - run: |
      nix develop
      zig fmt --check .
      zig build test
      zig build -Doptimize=ReleaseSafe
